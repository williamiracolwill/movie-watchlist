<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist</title>
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <div>
            <h1>Find your film</h1>
            <a href="">My Watchlist</a>
        </div>
        <form>
            <input type="text" name="movie-input" id="movie-input" placeholder="Search for a movie">
            <button type="submit" class="search-btn" id="search-btn">Search</button>
        </form>
    </header>
    <main>
        <div class="no-data" id="no-data">
            <img src="assets/no-data-initial.png" alt="movie reel icon with text saying start exploring">
        </div>
    </main>
</body>
</html>
